<div class="container-sm mt-2 p-2">
    <div class="row-cols-8 d-flex justify-content-end">
        <button type="button" class="btn btn-success" (click)="home()">Pagina Principal</button>
    </div>
</div>

<div class="container mt-5 d-flex justify-content-center align-items-sm-start">
  <div class="card shadow-sm p-4" style="width: 320px;">
    <h4 class="text-center fw-bold mb-3">Iniciar Sesión</h4>

    <form [formGroup]="frmLogin" (ngSubmit)="login()">
      <!-- Usuario -->
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" formControlName="username" id="username" 
               class="form-control" placeholder="Ingrese su usuario">
      </div>

      <!-- Contraseña -->
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" formControlName="password" id="password" 
               class="form-control" placeholder="Ingrese su contraseña">
      </div>

      <!-- Botón Ingresar -->
      <button type="submit" class="btn btn-primary">Ingresar</button>
    </form>
  </div>
</div>
